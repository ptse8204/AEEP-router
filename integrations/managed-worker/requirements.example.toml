allowed_approval_policies = ["never"]
allowed_web_search_modes = ["disabled"]
allow_managed_hooks_only = true
allowed_login_methods = ["chatgpt"]
default_permissions = "aeep"
[allowed_permission_profiles]
aeep = true

[permissions.aeep.filesystem]
":root" = "deny"
":minimal" = "read"
"/workspace" = "write"
"/tmp" = "write"
"/worker/auth" = "deny"
"/opt/codex" = "read"
[permissions.aeep.network]
enabled = false
[features]
apps = false
memories = false
multi_agent = false
browser_use = false
computer_use = false
