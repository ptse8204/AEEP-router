version: "0.5"
database: .aeep/economic-reference.db
default_policy: balanced

budget:
  budget_id: economic-reference
  daily_marketplace_limit_usd: 1.0
  max_per_action_usd: 0.01
  prepaid_balance_usd: 1.0
  authorization:
    auto_approve_under_usd: 0.01
    financial_actions_require_human: false

economic_evidence:
  enabled: true
  settlement_currency: USD
  live_quotes:
    enabled: true
    top_k: 1
    per_provider_timeout_seconds: 2
    total_timeout_seconds: 4
    maximum_response_bytes: 262144
    maximum_clock_skew_seconds: 30
    maximum_quote_ttl_seconds: 600
  requirements:
    require_binding_quote_for_paid_routes: true
    allow_verified_static_offer: true
    allow_static_prior: false
    minimum_evidence_level: SIGNED_QUOTE
    quote_failure_policy: REQUIRE_BINDING_QUOTE
  market_aggregates:
    enabled: false
  network:
    allowed_quote_hosts: [127.0.0.1]
    allow_private_addresses: true
    allow_redirects: false
    trust_environment_proxy: false
  trust_store:
    path: examples/economic_market/provider-keys.json
  payment:
    adapter: prepaid

executors:
  - id: reference.http.statistics
    provider_id: local.reference-provider
    capability: text.statistics@1
    kind: http
    description: Deterministic AEEP 0.5 text-statistics reference provider.
    input_schema:
      type: object
      properties:
        text: {type: string}
      required: [text]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        characters: {type: integer}
        words: {type: integer}
        lines: {type: integer}
      required: [characters, words, lines]
      additionalProperties: false
    estimate:
      resources:
        latency_ms: 10
        network_bytes: 1024
      success_probability: 1
      quality_score: 1
      risk_score: 0
      confidence: 0.9
    side_effect: none
    locality: lan
    requires_network: true
    data_residency: [local]
    idempotent: true
    safe_to_auto_execute: true
    enabled: true
    tags: [economic-reference]
    config:
      url: http://127.0.0.1:8787/v1/execute
      method: POST
      headers:
        Content-Type: application/json
      json:
        quote_id: "{quote_id}"
        prepared_id: "{prepared_id}"
        action_id: "{action.action_id}"
        attempt_id: "{attempt_id}"
        text: "{input.text}"
      timeout_seconds: 5
      max_request_bytes: 262144
      max_response_bytes: 262144
      follow_redirects: false
      trust_proxy_env: false
      allowed_hosts: [127.0.0.1]
      allow_private_networks: true
      allow_insecure_http: true
      output: {type: json, path: output}
      economic:
        dynamic_pricing: true
        requires_binding_quote: true
        paid_marketplace: true
        quote_endpoint: http://127.0.0.1:8787/v1/quotes
        offers_endpoint: http://127.0.0.1:8787/v1/offers
        execute_endpoint: http://127.0.0.1:8787/v1/execute
        usage_statement_endpoint: http://127.0.0.1:8787/v1/usage-statements
        reconciliation_endpoint: http://127.0.0.1:8787/v1/reconciliations
        quote_disclosure:
          fields:
            - source: action_features.input_bytes
              name: input_bytes
              type: integer
              minimum: 0
              maximum: 100000000
              required: true
          maximum_encoded_bytes: 256
