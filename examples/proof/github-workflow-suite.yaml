schema_version: "0.3"
suite_id: aeep-03-github-workflow-live-v2
domain: github-live-workflow
deterministic_tools_available: true
seed: 30305
repetitions: 20
baseline_route_id: direct-api
routes:
  - route_id: direct-api
    executor_id: github.raw-readme-title
  - route_id: hybrid-workflow
    validation_output_path: /title
    workflow:
      workflow_id: github-mcp-hybrid-benchmark-v1
      input:
        readme_url: https://raw.githubusercontent.com/ptse8204/AEEP-router/main/README.md
      constraints:
        max_side_effect: read
        allow_network: true
      steps:
        - step_id: fetch
          action:
            capability: web.fetch@1
            input: {url: "", raw: true, max_length: 20000}
          bindings:
            - {target_path: /url, source_path: /readme_url}
        - step_id: parse
          depends_on: [fetch]
          action:
            capability: markdown.parse-title@1
            input: {text: ""}
          bindings:
            - {target_path: /text, source_step_id: fetch, source_path: ""}
      outputs:
        - {name: title, step_id: parse, path: ""}
conditions: [process-cold, router-warm]
cases:
  - case_id: github-readme-title-workflow
    split: holdout
    action:
      capability: github.repository.readme-title@1
      input: {}
    validators:
      - kind: exact_match
        config: {expected: AEEP Agent Router}
