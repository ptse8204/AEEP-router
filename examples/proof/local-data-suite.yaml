    retrieved_at: 2026-08-13T00:00:00Z
    source_uri: urn:aeep:fixture-rate-card
    source_content_sha256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
    currency: USD
    rates:
      - {rate_id: input, rate_type: input_token, meter: input_tokens, input_unit: token, output_unit: USD, unit_quantity: 1000, rate_amount: 0.01}
      - {rate_id: cached, rate_type: cached_input_token, meter: cached_input_tokens, input_unit: token, output_unit: USD, unit_quantity: 1000, rate_amount: 0.002}
      - {rate_id: output, rate_type: output_token, meter: output_tokens, input_unit: token, output_unit: USD, unit_quantity: 1000, rate_amount: 0.03}
