      - {rate_id: credit-output, rate_type: subscription_unit, meter: output_tokens, input_unit: token, output_unit: fixture_credit, unit_quantity: 1000, rate_amount: 1}
cases:
  - case_id: local-qualification
    split: qualification
    action:
      capability: text.stats@1
      input: {text: alpha beta}
    validators:
      - kind: exact_match
        config: {expected: {characters: 10, words: 2, lines: 1}}
