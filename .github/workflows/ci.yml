name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,http-server]'
      - run: ruff check .
      - run: mypy src
      - run: python scripts/generate_schemas.py --check
      - run: python examples/economic_evidence/campaign.py --repetitions 30 --check --require-gates
      - run: python examples/dsh_campaign/campaign.py --check
      - run: python examples/dsh_campaign/live_campaign.py --check-report reports/v05/dsh/live-safety.json
      - run: python examples/dsh_campaign/live_campaign.py --check-comparison reports/v05/dsh/live-comparison.json
      - run: python examples/dsh_campaign/live_campaign.py --check-native-plan
      - run: python examples/job_application/campaign.py --check
      - run: aeep provider verify examples/provider_package/aeep-provider.yaml -m examples/provider_package/aeep.yaml --compact
      - run: coverage run -m pytest
      - run: coverage report -m
      - run: python -m build

  dsh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
        working-directory: integrations/dsh-aeep-router
      - run: npm test
        working-directory: integrations/dsh-aeep-router
