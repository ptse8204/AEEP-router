name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,http-server]'
      - run: python -m compileall -q src examples tests
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_assessment_policy.py
      - run: python scripts/generate_schemas.py --check
      - run: python examples/economic_evidence/campaign.py --repetitions 30 --check --require-gates
      - run: python examples/dsh_campaign/campaign.py --check
      - run: python examples/dsh_campaign/live_campaign.py --check-report reports/v05/dsh/live-safety.json
      - run: python examples/dsh_campaign/live_campaign.py --check-comparison reports/v05/dsh/live-comparison.json
      - run: python examples/dsh_campaign/live_campaign.py --check-native-plan
      - run: python examples/job_application/campaign.py --check
      - run: aeep provider verify examples/provider_package/aeep-provider.yaml -m examples/provider_package/aeep.yaml --compact
      - name: Check Windows portability before the full suite
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_posix_guards.py tests/test_v08_managed_workers.py tests/test_v08_pair_inspection.py tests/test_v08_three_way.py tests/test_v08_workbook.py tests/test_v08_skillsbench_recipe.py tests/test_v08_search_transport.py tests/test_v08_workers.py
      - name: Check macOS metrics relay before the full suite
        if: runner.os == 'macOS'
        run: python -m pytest tests/test_v08_codex_invocation.py -k catalog_metrics_real_http --maxfail=1
      - run: coverage run --branch -m pytest
        env:
          # Native-policy fixtures must not request access beneath /tmp or /var/tmp.
          TMPDIR: ${{ runner.temp }}
      - run: coverage json -o reports/v08/coverage.json
      - run: python scripts/check_critical_coverage.py reports/v08/coverage.json
      - run: python scripts/check_assessment_coverage.py reports/v08/coverage.json
      - run: coverage report -m
      - run: aeep verify router-complete --profile all --strict --json
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python -m build

  dsh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
        working-directory: integrations/dsh-aeep-router
      - run: npm test
        working-directory: integrations/dsh-aeep-router

  assessment-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev,http-server]'
      - name: Build the pinned assessment runtime
        run: docker build --iidfile /tmp/aeep-image-id integrations/assessment-runtime
      - name: Check real containment and interrupted-worker recovery
        shell: bash
        run: |
          export AEEP_CONTAINER_IMAGE="$(cat /tmp/aeep-image-id)"
          export AEEP_WORKBOOK_IMAGE="$AEEP_CONTAINER_IMAGE"
          export AEEP_CONTAINER_RUNTIME="$(command -v docker)"
          export AEEP_CONTAINER_SOCKET=/var/run/docker.sock
          python -m pytest -m assessment_boundary
