name: WSL installer acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/onboarding-host-checks]
permissions:
  contents: read
jobs:
  wsl:
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        version: [1, 2]
    env:
      WSL_UTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check host storage before installing dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wsl-evidence | Out-Null
          $drives = @(Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -ne $null })
          $drives | Select-Object Name, Free, Used | ConvertTo-Json | Set-Content wsl-evidence/windows-storage.json
          $target = $drives | Where-Object { $_.Free -ge 55GB } | Sort-Object Free -Descending | Select-Object -First 1
          if (!$target) { throw 'No runner filesystem has 55 GiB free; preserve the 50 GiB reserve.' }
          $root = Join-Path $target.Root "aeep-wsl-${{ matrix.version }}-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory $root | Out-Null
          "AEEP_CHECK_ROOT=$root" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build versioned candidate
        shell: pwsh
        run: |
          python -m pip install '.[dev]' 'uv==0.8.22'
          if ($LASTEXITCODE) { throw 'Build dependencies failed' }
          python scripts/build_installer.py --uv (Get-Command uv).Source --tag v0.8.2 --output "$env:AEEP_CHECK_ROOT/release"
          if ($LASTEXITCODE) { throw 'Release build failed' }
      - name: Install Ubuntu in actual WSL
        shell: pwsh
        run: |
          wsl --version | Set-Content wsl-evidence/wsl-version.txt
          wsl --set-default-version ${{ matrix.version }}
          if ($LASTEXITCODE) { throw 'WSL version selection failed' }
          wsl --install Ubuntu-24.04 --web-download --no-launch --location "$env:AEEP_CHECK_ROOT/distro"
          if ($LASTEXITCODE) { throw 'Ubuntu WSL installation failed' }
          wsl --list --verbose | Set-Content wsl-evidence/distributions.txt
      - name: Exercise installer inside WSL
        shell: pwsh
        run: |
          $source = (wsl -d Ubuntu-24.04 -u root -- wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $release = (wsl -d Ubuntu-24.04 -u root -- wslpath -u "$env:AEEP_CHECK_ROOT/release").Trim()
          wsl -d Ubuntu-24.04 -u root -- bash "$source/scripts/check_wsl.sh" "$release" "$source" "$source/wsl-evidence"
          if ($LASTEXITCODE) { throw 'WSL installer acceptance failed' }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Free, Used | ConvertTo-Json | Set-Content wsl-evidence/windows-storage-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsl-${{ matrix.version }}-acceptance
          path: wsl-evidence/
